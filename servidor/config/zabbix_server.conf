# =====================================================================
# zabbix_server.conf - Proyecto 7 Servicios Telematicos
# Montado como volumen en /etc/zabbix/custom/zabbix_server.conf
# =====================================================================

### Registro (a stdout del contenedor -> docker compose logs zabbix-server)
LogType=console
DebugLevel=3

### Base de datos (PostgreSQL en el contenedor postgres-server)
# Debe coincidir con POSTGRES_* del archivo .env
DBHost=postgres-server
DBName=zabbix
DBUser=zabbix
DBPassword=zabbix_st_2026
DBPort=5432

### Red
ListenPort=10051
Timeout=10

### Procesos recolectores
StartPollers=5
StartPollersUnreachable=1
StartPingers=2
StartHTTPPollers=2
StartTrappers=5
StartDiscoverers=1
StartAlerters=3

### Rendimiento / cache
CacheSize=64M
HistoryCacheSize=32M
ValueCacheSize=32M
HousekeepingFrequency=1
MaxHousekeeperDelete=5000

### Disponibilidad: marcar un host como inalcanzable rapido (para la demo)
UnreachablePeriod=45
UnavailableDelay=30
UnreachableDelay=15

### Scripts (incluidos en la imagen personalizada)
AlertScriptsPath=/usr/lib/zabbix/alertscripts
ExternalScripts=/usr/lib/zabbix/externalscripts
FpingLocation=/usr/sbin/fping
Fping6Location=/usr/sbin/fping6

### Varios
LogSlowQueries=3000
StatsAllowedIP=127.0.0.1
TmpDir=/tmp
