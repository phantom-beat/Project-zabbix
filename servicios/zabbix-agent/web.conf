# Parametros adicionales del Zabbix Agent 2 del host "web"
# (montado en /etc/zabbix/zabbix_agent2.d/st.conf)
# El agente comparte red y procesos con el contenedor "web" (sidecar).
UserParameter=st.contenedor.rol,echo "web - nginx (HTTP)"
UserParameter=st.contenedor.procesos,ps | tail -n +2 | wc -l
