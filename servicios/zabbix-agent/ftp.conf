# Parametros adicionales del Zabbix Agent 2 del host "ftp"
# (montado en /etc/zabbix/zabbix_agent2.d/st.conf)
# El agente comparte red y procesos con el contenedor "ftp" (sidecar).
UserParameter=st.contenedor.rol,echo "ftp - vsftpd (FTP)"
UserParameter=st.contenedor.procesos,ps | tail -n +2 | wc -l
