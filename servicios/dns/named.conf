// BIND9 - host "dns" del Proyecto 7
options {
    directory "/var/bind";
    pid-file "/var/run/named/named.pid";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
    dnssec-validation no;
};

zone "servicios.local" IN {
    type master;
    file "/etc/bind/zones/db.servicios.local";
};
