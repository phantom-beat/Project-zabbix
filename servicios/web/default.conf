# nginx - host "web" del Proyecto 7
server {
    listen 80;
    server_name web.servicios.local _;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # Metricas internas de nginx (solo desde el propio contenedor / agente)
    location = /basic_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }

    location = /salud {
        default_type text/plain;
        return 200 "OK\n";
    }
}
